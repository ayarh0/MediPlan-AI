<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediPlan-AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 10px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        .medication {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>MediPlan-AI</h1>

        <div class="card">
            <h2>Add Medication</h2>

            <input id="name" type="text" placeholder="Medication name">
            <input id="dosage" type="text" placeholder="Dosage">
            <input id="frequency" type="text" placeholder="Frequency">
            <input id="start_date" type="date">
            <input id="end_date" type="date">

            <button onclick="addMedication()">
                Add Medication
            </button>
        </div>

        <div class="card">
            <h2>My Medications</h2>

            <div id="medications">
                Loading...
            </div>
        </div>

    </div>

    <script>

        async function loadMedications() {

            const response = await fetch("/medications");

            const medications = await response.json();

            const container = document.getElementById("medications");

            container.innerHTML = "";

            medications.forEach(medication => {

                const div = document.createElement("div");

                div.className = "medication";

                div.innerHTML = `
                    <strong>${medication.name}</strong><br>
                    Dosage: ${medication.dosage}<br>
                    Frequency: ${medication.frequency}<br>
                    Start: ${medication.start_date}<br>
                    End: ${medication.end_date}
                `;

                container.appendChild(div);
            });
        }


        async function addMedication() {

            const medication = {

                name: document.getElementById("name").value,
                dosage: document.getElementById("dosage").value,
                frequency: document.getElementById("frequency").value,
                start_date: document.getElementById("start_date").value,
                end_date: document.getElementById("end_date").value

            };

            const response = await fetch("/medications", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(medication)
            });

            const result = await response.json();

            alert(result.message);

            loadMedications();
        }


        loadMedications();

    </script>

</body>
</html>
